general:
  # instrument
  instrument: NIRPS_HE
  # science fiber
  science_fiber: A
  # science types
  science_types:
    - OBJ_FP
    - OBJ_DARK
    - OBJ_SKY
    - TELLU_SKY
    - FLUXSTD_SKY
  # spectral bands to show in the UI
  bands:
    - Y
    - H
  # has polarimetry
  has_polarimetry: false
  # query-db preset file (relative to resources/aprofile_qdb_presets/)
  db-query-preset-file: nirps_he_v8.txt
observatory:
  # ESO 3.6m, La Silla, Chile
  lat: -29.2562
  lon: -70.7342
  alt: 2400
plot:
  # Spectrum wavelength ranges in nm
  SpecWave:
    limit0:
      - 985
      - 1810
    limit1:
      - 1082
      - 1085
    limit2:
      - 1575
      - 1580
    limit3:
      - 1666
      - 1668
  # Wavelength range of interest for debug telluric correction map
  TcorrMapWave:
    - 1716
    - 1726
