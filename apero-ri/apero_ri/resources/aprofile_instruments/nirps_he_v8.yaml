        p99_max: 1000
        sat_frac_max: 0.0004
      FLAT,DARK,LAMP:
        p99_min: 100
        p99_max: 1000
        sat_frac_max: 0.0004
      FLAT,LAMP,LAMP:
        p99_min: 100
        p99_max: 1000
        sat_frac_max: 0.0004
      CONTAM,DARK,FP:
