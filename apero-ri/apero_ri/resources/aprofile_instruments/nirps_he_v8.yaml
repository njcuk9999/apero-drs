    enabled: true
    required_obnames:
      Afternoon-Calibrations:
        mjd_start: 60096
        mjd_end: 99999
      Daily-Calibrations-Full-Set:
        mjd_start: 59895
        mjd_end: 99999
  no_sci:
    enabled: true
    dprtypes:
    - OBJECT,SKY
    - OBJECT,FP
  qual_test:
    enabled: true
    dpr_groups:
      FP:
      - WAVE,FP,FP
      - WAVE,UN1,UN1
      - WAVE,FP,UN1
      - WAVE,UN1,FP
      - CONTAM,DARK,FP
      FLAT:
      - FLAT,LAMP,DARK
      - FLAT,DARK,LAMP
      - FLAT,LAMP,LAMP
      - ORDERDEF,DARK,LAMP
      - ORDERDEF,LAMP,DARK
      TELLURIC:
      - TELLURIC,SKY
      SCIENCE:
      - OBJECT,SKY
      - OBJECT,FP
    constraints:
      OBJECT,SKY:
        p99_min: 0
        p99_max: 10000
        sat_frac_max: 0.0004
      OBJECT,FP:
        p99_min: 0
        p99_max: 10000
        sat_frac_max: 0.0004
      ORDERDEF,DARK,LAMP:
        p99_min: 100
        p99_max: 1000
        sat_frac_max: 0.0004
      ORDERDEF,LAMP,DARK:
        p99_min: 100
        p99_max: 1000
        sat_frac_max: 0.0004
      TELLURIC,SKY:
