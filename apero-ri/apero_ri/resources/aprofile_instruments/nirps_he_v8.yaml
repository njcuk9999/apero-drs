  common:
    header_keys:
      dpr_type: HIERARCH ESO DPR TYPE
      obs_name: HIERARCH ESO OBS NAME
      mjd_obs: MJD-OBS
  calib_test:
    enabled: true
    required_dprtypes:
    - DARK
    - WAVE,FP,FP
    - WAVE,UN1,FP
    - WAVE,FP,UN1
    - FLAT,DARK,LAMP
    - FLAT,LAMP,DARK
    - WAVE,UN1,UN1
