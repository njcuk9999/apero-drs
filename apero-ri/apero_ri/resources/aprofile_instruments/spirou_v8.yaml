# General instrument configuration.
general:

  # Instrument code used by APERO/ARI.
  instrument: SPIROU

  # Science fiber identifier.
  science_fiber: AB

  # Science DPR/TYPES included in tools.
  science_types:
    - OBJ_DARK
    - OBJ_FP
    - POLAR_DARK
    - POLAR_FP

  # Spectral bands shown in the interface.
  bands:
    - Y
    - H

  # Whether this instrument has polarimetry.
  has_polarimetry: true

  # Default DB-query preset filename.
  db-query-preset-file: spirou_v8.txt

# Observatory site metadata.
observatory:

  # Observatory latitude in degrees.
  lat: 19.8283

  # Observatory longitude in degrees.
  lon: -155.4683

  # Observatory altitude in meters.
  alt: 4204

# Plot defaults and wavelength windows.
plot:

  # Main spectrum wavelength windows (nm).
  SpecWave:
    limit0:
      - 965
      - 2500
    limit1:
      - 1082
      - 1085
    limit2:
      - 1600
      - 1604
    limit3:
      - 2164
      - 2169

  # Telluric map wavelength range (nm).
  TcorrMapWave:
    - 1716
    - 1726

# Legacy checks Google Sheets configuration.
legacy_checks_gsheet:

  # Monitoring sheet URL for this profile/instrument.
  monitoring_sheet_url: ''

  # Override sheet URL for this profile/instrument.
  override_sheet_url: ''

# Header-key mappings shown in science views.
sci-headers:

  # Mappings for pp-level files.
  pp:
    PP_MJDMID:
      key: MJDMID
      label: MJD
      dtype: float
      timefmt: mjd
    PP_PROC:
      key: DRSPDATE
      label: Process Date
      dtype: str
      timefmt: iso
    PP_VERSION:
      key: PVERSION
      label: Version [pp]
      dtype: str
    PP_PI_NAME:
      key: PI_NAME
      label: PI name(s) in header
      dtype: str
    PP_PROG_ID:
      key: RUNID
      label: Program ID
      dtype: str

  # Mappings for ext-level files.
  ext:
    EXT_MJDMID:
      key: MJDMID
      label: MJD
      dtype: float
      timefmt: mjd
    EXT_PROC:
      key: DRSPDATE
      label: Process Date
      dtype: str
      timefmt: iso
    EXT_Y:
      key: EXTSN009
      label: 'SNR[Order 8 (#71 1.08μm)]'
      dtype: float
    EXT_H:
      key: EXTSN035
      label: 'SNR[Order 35 (#44 1.75μm)]'
      dtype: float
    EXT_DPRTYPE:
      key: DPRTYPE
      label: 'DPR TYPE'
      dtype: str
    EXT_BERV:
      key: BERV
      label: BERV
      unit: km/s
      dtype: float
    EXT_BJD:
      key: BJD
      label: BJD
      dtype: float
    EXT_QCC_ALL:
      key: QCC_ALL
      label: QCC ALL
      dtype: int
    EXT_SEEING:
      key: WDSEEMED
      label: Seeing at start
      dtype: float
    EXT_AIRMASS:
      key: AIRMASS
      label: Airmass at start
      dtype: float
    EXT_EXPTIME:
        key: EXPTIME
        label: Exposure Time
        dtype: float
    EXT_VERSION:
      key: VERSION
      label: Version [ext]
      dtype: str
    EXT_PDATE:
      key: DRSPDATE
      label: APERO Processed date
      dtype: str
    EXT_SHAPE_DX:
      key: SHAPE_DX
      label: Shape DX
      dtype: float
    EXT_SHAPE_DY:
      key: SHAPE_DY
      label: Shape DY
      dtype: float
    EXT_SHAPE_A:
      key: SHAPE_A
      label: Shape A
      dtype: float
    EXT_SHAPE_B:
      key: SHAPE_B
      label: Shape B
      dtype: float
    EXT_SHAPE_C:
      key: SHAPE_C
      label: Shape C
      dtype: float
    EXT_SHAPE_D:
      key: SHAPE_D
      label: Shape D
      dtype: float
    EXT_WFPDRIFT:
      key: WFPDRIFT
      label: Wavesol abs CCF FP drift [km/s]
      dtype: float
    EXT_WCAV000:
      key: WCAV000
      label: Wave cavity c0
      dtype: float
    EXT_EXTSMAX:
      key: EXTSMAX
      label: Max saturation level
      dtype: float
    EXT_EFFRON:
      key: EFFRON
      label: Measured eff readout noise before extraction
      dtype: float
    EXT_CDTDARK:
      key: CDTDARK
      label: DARK file
      dtype: float
      ref: true
    EXT_CDTBAD:
      key: CDTBAD
      label: BADPIX file
      dtype: float
    EXT_CDTBACK:
      key: CDTBACK
      label: BACKGROUND file
      dtype: float
    EXT_CDTORDP:
      key: CDTORDP
      label: ORDER_PROFILE file
      dtype: float
    EXT_CDTLOCO:
      key: CDTLOCO
      label: LOCO file
      dtype: float
    EXT_CDTSHAPL:
      key: CDTSHAPL
      label: Local shape file
      dtype: float
    EXT_CDTSHAPX:
      key: CDTSHAPX
      label: Shape X file
      dtype: float
      ref: true
    EXT_CDTSHAPY:
      key: CDTSHAPY
      label: Shape Y file
      dtype: float
      ref: true
    EXT_CDTFLAT:
      key: CDTFLAT
      label: FLAT file
      dtype: float
    EXT_CDTBLAZE:
      key: CDTBLAZE
      label: BLAZE file
      dtype: float
    EXT_CDTWAVE:
      key: CDTWAVE
      label: Wave file
      dtype: float
    EXT_WAVETIME:
      key: WAVETIME
      label: Wave sol
      dtype: float

  # Mappings for tcorr-level files.
  tcorr:
    TCORR_MJDMID:
      key: MJDMID
      label: MJD
      dtype: float
      timefmt: mjd
    TCORR_BERV:
      key: BERV
      label: BERV
      unit: km/s
      dtype: float
    TCORR_BJD:
      key: BJD
      label: BJD
      dtype: float
    TCORR_QCC_ALL:
      key: QCC_ALL
      label: QCC ALL
      dtype: int
    TCORR_H:
      key: EXTSN035
      label: 'SNR[Order 35 (#44 1.75μm)]'
      dtype: float
    TCORR_PROC:
      key: DRSPDATE
      label: Process Date
      dtype: str
      timefmt: iso
    TCORR_VERSION:
      key: VERSION
      label: APERO Version
      dtype: str

  # Mappings for ccf-level files.
  ccf:
    CCF_MASK:
      key: CCFMASK
      label: CCF Mask
      dtype: str
    CCF_MJDMID:
      key: MJDMID
      label: CCF MJD
      dtype: float
      timefmt: mjd
    CCF_PROC:
      key: DRSPDATE
      label: Process Date
      dtype: str
      timefmt: iso
    CCF_DV:
      key: RV_CORR
      label: CCF RV
      unit: km/s
      dtype: float
    CCF_SDV:
      key: DVRMS_CC
      label: CCF RV Error
      unit: m/s
      dtype: float
    CCF_FWHM:
      key: CCFMFWHM
      label: CCF FWHM
      unit: km/s
      dtype: float
    CCF_VERSION:
      key: VERSION
      label: Version [ccf]
      dtype: str

  # Mappings for lbl-level files.
  lbl:
    EXT_H:
      key: EXTSN035
      label: 'SNR[Order 35 (#44 1.75μm)]'
      dtype: float
    LBL_VERSION:
      key: LBL_VERS
      label: LBL Version
      dtype: str

# Calib headers setting.
calib-headers:

  # SHAPEL setting.
  SHAPEL:
    KW_MID_OBS_TIME:
      key: MJDMID
      label: mid exposure time [MJD]
      dtype: float
      timefmt: mjd
    KW_SHAPE_DX:
      key: SHAPE_DX
      label: Shape dx
      dtype: float
    KW_SHAPE_DY:
      key: SHAPE_DY
      label: Shape dy
      dtype: float
    KW_SHAPE_A:
      key: SHAPE_A
      label: Shape A
      dtype: float
    KW_SHAPE_B:
      key: SHAPE_B
      label: Shape B
      dtype: float
    KW_SHAPE_C:
      key: SHAPE_C
      label: Shape C
      dtype: float
    KW_SHAPE_D:
      key: SHAPE_D
      label: Shape D
      dtype: float

  # WAVE NIGHT setting.
  WAVE_NIGHT:
    KW_MID_OBS_TIME:
      key: MJDMID
      label: mid exposure time [MJD]
      dtype: float
      timefmt: mjd
    KW_EXT_NBO:
      key: EXT_NBO
      label: Number of extracted orders
      dtype: int
    KW_WFP_DRIFT:
      key: WFPDRIFT
      label: Wavesol abs CCF FP drift [km/s]
      dtype: float
    KW_CAVITY_WIDTH:
      key: WCAV000
      label: Wave cavity [intercept]
      dtype: float

# APERO checks and monitor defaults.
apero-checks:

  # Common APERO-check settings.
  common:

    # Header key aliases used by this check group.
    header_keys:
      dpr_type: ''
      obs_name: ''
      mjd_obs: ''
      obj_name: ''

  # Calibration-presence check settings.
  calib_test:

    # Enable or disable this check.
    enabled: false

    # Required DPRTYPE entries for this check.
    required_dprtypes: []

  # Calibration OB-name check settings.
  calib_ob_test:

    # Enable or disable this check.
    enabled: false

    # Required OB name windows for this check.
    required_obnames: {}

  # No-science-night check settings.
  no_sci:

    # Enable or disable this check.
    enabled: false

    # DPRTYPE entries used by this check.
    dprtypes: []

  # Quality-threshold check settings.
  qual_test:

    # Enable or disable this check.
    enabled: false

    # DPRTYPE groups used by this check.
    dpr_groups: {}

    # Constraints setting.
    constraints: {}

  # Engineering-night exclusion settings.
  eng_test:

    # Tests setting.
    tests:
      enclosure_temperature_rms:
        enabled: false
      enclosure_setpoint_offset:
        enabled: false
      vacuum_gauge_upper:
        enabled: false
      isolation_valve_state:
        enabled: false
      cryo1_status_state:
        enabled: false
      cryo2_status_state:
        enabled: false
      turbopump_status_state:
        enabled: false
      warning_cryo1_state:
        enabled: false
      warning_cryo2_state:
        enabled: false
      fp_interior_rms:
        enabled: false
      fp_exterior_range:
        enabled: false
      fp_setpoint_rms:
        enabled: false
      enclosure_heater_power_max:
        enabled: false
      scrambling_status_science:
        enabled: false
      stretcher_status_state:
        enabled: false
      backend_device_error_state:
        enabled: false

  # Astrometrics object-name check settings.
  astrom_test:

    # Enable or disable this check.
    enabled: true

    # FITS header keys to try (in order) for the object name.
    obj_name_keys:
      - OBJECT
      - OBJNAME

    # Only files whose DPRTYPE appears in this list are checked.
    # An empty list means all files are checked regardless of DPRTYPE.
    dprtypes: []

    # When set, use filename suffix as the science filter instead of DPRTYPE.
    # e.g. 'o.fits' selects only SPIRou raw science frames by filename.
    sci_suffix: o.fits

  # Critical instrument and science checks (CRITICAL_TEST, CRITICAL_SCI_TEST).
  # SPIRou does not use critical checks; blank values cause checks to pass.
  critical_check:

    # Blank = pass for SPIRou.
    critical csv file: ''

    # Blank = pass for SPIRou.
    critical desc file: ''

# Finder setting.
finder:

  # DTMIN setting.
  DTMIN: -6

  # DTMAX setting.
  DTMAX: 6

  # DTVAL setting.
  DTVAL: 3

  # BANDS setting.
  BANDS:
    - G
    - J

  # FIELD OF VIEW setting.
  FIELD_OF_VIEW:
    G:
      - 77.6
      - 77.6
    J:
      - 18.2
      - 18.2

  # SCALE FACTOR setting.
  SCALE_FACTOR:
    G: 1.5

  # PIXEL SCALE setting.
  PIXEL_SCALE:
    G: 0.1514
    J: 0.1514

  # TRANSFORM ROTATE setting.
  TRANSFORM_ROTATE:
    G: 232.6
    J: 322.6

  # FWHM setting.
  FWHM:
    G: 2.0
    J: 2.0

  # SIGMA LIMIT setting.
  SIGMA_LIMIT:
    G: 18
    J: 15
    H: 15
    K: 15

  # MAG LIMIT setting.
  MAG_LIMIT: -1

  # MAX PM setting.
  MAX_PM: 11

  # SCALE SIZE setting.
  SCALE_SIZE: 10

  # COMPASS FRAC setting.
  COMPASS_FRAC: 0.075

  # FLIP X setting.
  FLIP_X:
    G: True
    J: True

  # FLIP Y setting.
  FLIP_Y:
    G: False
    J: False
