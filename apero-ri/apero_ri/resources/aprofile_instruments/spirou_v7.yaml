general:
  # instrument
  instrument: SPIROU
  # science fiber
  science_fiber: AB
  # science types
  science_types:
    - OBJ_DARK
    - OBJ_FP
    - POLAR_DARK
    - POLAR_FP
  # spectral bands to show in the UI
  bands:
    - Y
    - H
  # has polarimetry
  has_polarimetry: true
  # query-db preset file (relative to resources/aprofile_qdb_presets/)
  db-query-preset-file: spirou_v7.txt
plot:
  # Spectrum wavelength ranges in nm
  SpecWave:
    limit0:
      - 965
      - 2500
    limit1:
      - 1082
      - 1085
    limit2:
      - 1600
      - 1604
    limit3:
      - 2164
      - 2169
  # Wavelength range of interest for debug telluric correction map
  TcorrMapWave:
    - 1716
    - 1726
# Header keys
headers:
  pp:
    PP_MJDMID:
      key: MJDMID
      label: MJD
      dtype: float
      timefmt: mjd
    PP_PROC:
      key: DRSPDATE
      label: Process Date
      dtype: str
      timefmt: iso
    PP_VERSION:
      key: PVERSION
      label: Version [pp]
      dtype: str
    PP_PI_NAME:
      key: PI_NAME
      label: PI name(s) in header
      dtype: str
    PP_PROG_ID:
      key: RUNID
      label: Program ID
      dtype: str
  ext:
    EXT_MJDMID:
      key: MJDMID
      label: MJD
      dtype: float
      timefmt: mjd
    EXT_PROC:
      key: DRSPDATE
      label: Process Date
      dtype: str
      timefmt: iso
    EXT_Y:
      key: EXTSN009
      label: 'SNR[Order 8 (#71 1.08$\mu$m)]'
      dtype: float
    EXT_H:
      key: EXTSN035
      label: 'SNR[Order 35 (#44 1.75$\mu$m)]'
      dtype: float
    EXT_DPRTYPE:
      key: DPRTYPE
      label: 'DPR TYPE'
      dtype: str
    EXT_BERV:
      key: BERV
      label: BERV
      unit: km/s
      dtype: float
    EXT_BJD:
      key: BJD
      label: BJD
      dtype: float
    EXT_QCC_ALL:
      key: QCC_ALL
      label: QCC ALL
      dtype: int
    EXT_SEEING:
      key: WDSEEMED
      label: Seeing at start
      dtype: float
    EXT_AIRMASS:
      key: AIRMASS
      label: Airmass at start
      dtype: float
    EXT_EXPTIME:
        key: EXPTIME
        label: Exposure Time
        dtype: float
    EXT_VERSION:
      key: VERSION
      label: Version [ext]
      dtype: str
    EXT_PDATE:
      key: DRSPDATE
      label: APERO Processed date
      dtype: str
    EXT_SHAPE_DX:
      key: SHAPE_DX
      label: Shape DX
      dtype: float
    EXT_SHAPE_DY:
      key: SHAPE_DY
      label: Shape DY
      dtype: float
    EXT_SHAPE_A:
      key: SHAPE_A
      label: Shape A
      dtype: float
    EXT_SHAPE_B:
      key: SHAPE_B
      label: Shape B
      dtype: float
    EXT_SHAPE_C:
      key: SHAPE_C
