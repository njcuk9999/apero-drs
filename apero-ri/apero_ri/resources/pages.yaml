# ==============================================================================
# APERO RI: Top Level Page Definitions
# ==============================================================================
# Key legend per page:
#   label: Display name for cards/nav
#   parent: Parent page ID (or None for root)
#   view-permission: Permission required to view page
#   icon: FontAwesome icon class
#   quick-nav: Show in top quick nav menu
#   side-nav:
#     pinned: Always show in sidebars (if user has permission)
#     top-level: Acts as side-nav root for descendants
#     show: Include page in sidebars/cards
#   label can include {username} for auth-aware pinned items
home:
  label: Home
  parent: None
  view-permission: view.home
  icon: fa-solid fa-house
  quick-nav: True
  side-nav:
    pinned: False
    top-level: False
    show: True

home.docs:
  label: Documentation
  parent: home
  view-permission: view.doc
  icon: fa-brands fa-readme
  quick-nav: True
  side-nav:
    pinned: True
    top-level: True
    show: True

home.data_portal:
  label: Data Portal
  parent: home
  view-permission: view.data_portal
  icon: fa-solid fa-database
  quick-nav: True
  side-nav:
    pinned: True
    top-level: True
    show: True

home.monitor_portal:
  label: Monitor Portal
  parent: home
  view-permission: monitor
  icon: fa-solid fa-chart-line
  quick-nav: True
  side-nav:
    pinned: True
    top-level: True
    show: True

home.admin_portal:
  label: Admin Portal
  parent: home
  view-permission: view.admin
  icon: fa-solid fa-user-shield
  quick-nav: True
  side-nav:
    pinned: True
    top-level: True
    show: True

home.astrometrics:
  label: Astrometrics
  parent: home
  view-permission: view.data_portal
  icon: fa-solid fa-compass
  quick-nav: True
  side-nav:
    pinned: True
    top-level: True
    show: True

home.user_portal:
  label: User Portal
  parent: home
  view-permission: view.home
  icon: fa-solid fa-user
  quick-nav: True
  side-nav:
    pinned: True
    top-level: True
    show: True

home.github:
  label: GitHub
  parent: home
  view-permission: view.home
  icon: fa-brands fa-github
  quick-nav: True
  external-url: https://github.com/njcuk9999/apero-drs
  side-nav:
    pinned: False
    top-level: False
    show: True

home.login:
  label: Login
  parent: home
  view-permission: view.home
  icon: fa-solid fa-right-to-bracket
  quick-nav: True
  side-nav:
    pinned: False
    top-level: False
    show: True
  
