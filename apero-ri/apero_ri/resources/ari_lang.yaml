? APERO Monitors help keep the instrument data reduction pipelines running smoothly
  — a great, flexible way to gain hands-on experience with real telescope data.
: ES: Los monitores de APERO ayudan a que los pipelines de reducción de datos de
    los instrumentos funcionen sin problemas — una forma excelente y flexible de
    adquirir experiencia práctica con datos reales de telescopio.
  FR: Les moniteurs APERO aident à assurer le bon fonctionnement des pipelines de
    réduction des données des instruments — une excellente façon, flexible, d'acquérir
    une expérience pratique avec de vraies données de télescope.
