? Define reusable local and DB SSH tunnel database connections that APERO profiles
  reference. Use Local for direct connections and DB SSH Tunnel for connections
  routed through an SSH gateway.
: ES: Defina conexiones de base de datos reutilizables (locales o por túnel SSH)
    a las que hacen referencia los perfiles de APERO. Use Local para conexiones
    directas y DB SSH Tunnel para conexiones a través de una pasarela SSH.
  FR: Définissez des connexions de base de données réutilisables (locales ou par
    tunnel SSH) auxquelles les profils APERO font référence. Utilisez Local pour
    les connexions directes et DB SSH Tunnel pour les connexions passant par une
    passerelle SSH.
? Define science groups and manage run-ID membership for access control and profile
  visibility. Use refresh to rescan available run IDs from object tables.
: ES: Defina los grupos científicos y gestione la pertenencia de los run ID para
    el control de acceso y la visibilidad de los perfiles. Use Actualizar para volver
    a leer los run ID disponibles en las tablas de objetos.
  FR: Définissez les groupes scientifiques et gérez l'appartenance des run ID pour
    le contrôle d'accès et la visibilité des profils. Utilisez Actualiser pour relire
    les run ID disponibles dans les tables d'objets.
