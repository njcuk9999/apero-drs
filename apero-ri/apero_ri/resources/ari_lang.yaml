  ES: Comprobación de actualización
"ARI suggests updating if the installed database is more than 30 days old. This check is local only and never contacts MaxMind.":
  FR: ARI recommande une mise à jour si la base installée date de plus de 30 jours. Cette vérification est locale et ne contacte jamais MaxMind.
  ES: ARI recomienda actualizar si la base instalada tiene más de 30 días. Esta comprobación es local y nunca contacta con MaxMind.
"Enable the GeoLite freshness check in Admin Health":
