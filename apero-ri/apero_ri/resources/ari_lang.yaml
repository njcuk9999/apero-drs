Configure backup destinations and schedules. Validate credentials and paths first, then enable recurring backups.:
  ES: Configure los destinos y los calendarios de las copias de seguridad. Valide
    primero las credenciales y las rutas y luego active las copias periódicas.
  FR: Configurez les destinations et les calendriers de sauvegarde. Validez d'abord
    les identifiants et les chemins, puis activez les sauvegardes récurrentes.
Configure outbound email service for alerts and notifications. Test your settings before enabling automated sends.:
  ES: Configure el servicio de correo saliente para alertas y notificaciones. Pruebe
    la configuración antes de activar los envíos automáticos.
  FR: Configurez le service de courriel sortant pour les alertes et les notifications.
    Testez vos paramètres avant d'activer les envois automatiques.
