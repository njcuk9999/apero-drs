? APERO is a pipeline designed to reduce astrophysical observations (specifically
  from echelle spectrographs). This is the APERO data portal where you can view
  documentation, install and with permission access some of our reductions.
: ES: APERO es un pipeline diseñado para reducir observaciones astrofísicas (en
    particular de espectrógrafos echelle). Este es el portal de datos de APERO donde
    puede consultar la documentación, instalar APERO y, con permiso, acceder a algunas
    de nuestras reducciones.
  FR: APERO est un pipeline conçu pour réduire des observations astrophysiques (en
    particulier de spectrographes échelle). Ceci est le portail de données APERO
    où vous pouvez consulter la documentation, installer APERO et, avec autorisation,
    accéder à certaines de nos réductions.
