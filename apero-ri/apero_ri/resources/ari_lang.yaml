? Connect ARI to running {c0} dashboards through SSH tunnels. Each queue is linked
  to an APERO profile; monitors who can access that profile see it on the Monitor
  Portal APERO Queue page, apart from the actions you block for monitors.
: ES: Conecte ARI a los paneles {c0} en ejecución mediante túneles SSH. Cada cola
    está vinculada a un perfil de APERO; los monitores con acceso a ese perfil la
    ven en la página Cola de APERO del portal de monitores, salvo las acciones que
    bloquee para los monitores.
  FR: Connectez ARI aux tableaux de bord {c0} en cours d'exécution via des tunnels
    SSH. Chaque file d'attente est liée à un profil APERO ; les moniteurs ayant
    accès à ce profil la voient sur la page File d'attente APERO du portail des
    moniteurs, à l'exception des actions que vous bloquez pour les moniteurs.
? Control group-level database table permissions across science groups and profiles.
  Grant minimum required access to balance security and usability.
: ES: Controle los permisos de las tablas de la base de datos por grupo, para los
    grupos científicos y los perfiles. Conceda el acceso mínimo necesario para equilibrar
    seguridad y facilidad de uso.
  FR: Contrôlez les permissions des tables de base de données par groupe, pour les
    groupes scientifiques et les profils. Accordez l'accès minimum nécessaire pour
    concilier sécurité et facilité d'utilisation.
