  FR: Aucune base installée ; vérification ignorée.
  ES: No hay base instalada; se omite la comprobación.
"GeoLite freshness check is disabled.":
  FR: La vérification d'actualité de GeoLite est désactivée.
  ES: La comprobación de vigencia de GeoLite está desactivada.
"GeoLite database was last updated {days} days ago; consider updating it.":
  FR: La base GeoLite a été mise à jour il y a {days} jours ; envisagez de l'actualiser.
  ES: La base GeoLite se actualizó hace {days} días; considere actualizarla.
"GeoLite database is within the update window.":
  FR: La base GeoLite est dans la période de mise à jour recommandée.
  ES: La base GeoLite está dentro del período recomendado de actualización.
"GeoLite database is installed, but update time is unknown.":
  FR: La base GeoLite est installée, mais sa date de mise à jour est inconnue.
  ES: La base GeoLite está instalada, pero se desconoce cuándo se actualizó.
"GeoLite database update time is invalid.":
  FR: La date de mise à jour de la base GeoLite est invalide.
  ES: La fecha de actualización de la base GeoLite no es válida.
"MaxMind currently limits GeoLite database downloads to 30 per account per day. ARI allows at most 3 attempts per day and enforces a one-hour cooldown.":
  FR: MaxMind limite actuellement les téléchargements GeoLite à 30 par compte et par jour. ARI autorise au plus 3 tentatives par jour et impose un délai d'une heure entre elles.
  ES: MaxMind limita actualmente las descargas de GeoLite a 30 por cuenta y día. ARI permite como máximo 3 intentos al día e impone una espera de una hora.
