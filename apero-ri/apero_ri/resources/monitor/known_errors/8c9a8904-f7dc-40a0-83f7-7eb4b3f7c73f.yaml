generic_error: 'class apero.core.core.drs_exceptions.LogExit : E[09-001-00033]: No
  valid input files files after QC test:{PATH+FILE}_pp_e2dsff_tcorr_A.fits: QCC_ALL
  = False ||'
comments: This means that the telluric correction for this object failed quality control.
  If the target has very low SNR this is expected (do dfits {filename} | grep QCC
  and you should see a list of QCC parameters, with QCC{num}P = 0 being the ones that
  failed. QCC{num}N is the name of the quality control parameter, QCC{num}L is the
  logic for failure i.e. X < 10  means if X is less than 10 this recipe fails quality
  control, QCC{num}V is the value (i.e. the "X" from the logic). Have a quick check
  and see what actually failed. You can bring this up at the next babysitter meeting
  but if the SNR was low and it failed due to that you can ignore it.
