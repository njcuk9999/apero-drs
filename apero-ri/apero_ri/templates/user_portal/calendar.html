{% extends "general/sidebar_base.html" %}
{% block title %}APERO RI – {{ page_label }}{% endblock %}

{% block doc_content %}
<div class="ari-page-header">
    <h1><i class="{{ page_icon }}"></i> {{ page_label }}</h1>
    <p class="ari-page-subtitle">Personal events and instrument milestones.</p>
</div>

<div class="ari-ud-toolbar">
    <button class="ari-btn ari-btn--primary ari-btn--sm" id="cal-add-btn">
        <i class="fa-solid fa-plus"></i> New Event
    </button>
    {% if instruments %}
    <select id="cal-instr-select" class="ari-ud-select">
        <option value="__all__" selected>— All events (personal + instruments) —</option>
        <option value="">— Personal events only —</option>
        {% for instr in instruments %}
        <option value="{{ instr }}">{{ instr }} (include instrument events)</option>
        {% endfor %}
    </select>
    {% endif %}
    <div class="ari-cal-nav">
        <button class="ari-btn ari-btn--secondary ari-btn--sm" id="cal-prev"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="cal-month-label" class="ari-cal-month-label"></span>
        <button class="ari-btn ari-btn--secondary ari-btn--sm" id="cal-next"><i class="fa-solid fa-chevron-right"></i></button>
        <button class="ari-btn ari-btn--secondary ari-btn--sm" id="cal-today">Today</button>
    </div>
</div>

<div id="cal-grid" class="ari-cal-grid"></div>

<!-- Event modal -->
<div id="cal-modal" class="ari-ud-modal" style="display:none;">
    <div class="ari-ud-modal-box">
        <h3 id="cal-modal-title">New Event</h3>
        <div class="ari-form-group">
            <label>Title</label>
            <input type="text" id="cal-modal-event-title" placeholder="Event title">
        </div>
        <div class="ari-form-group">
            <label>Date</label>
            <input type="date" id="cal-modal-date">
        </div>
        <div class="ari-form-group">
            <label>Time (optional)</label>
            <input type="time" id="cal-modal-time">
        </div>
        <div class="ari-form-group">
            <label>Category</label>
            <select id="cal-modal-category">
                <option value="personal">Personal</option>
                <option value="work">Work</option>
                <option value="observation">Observation</option>
                <option value="deadline">Deadline</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="ari-form-group">
            <label>Recurrence</label>
            <select id="cal-modal-recurrence">
                <option value="none">None</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
            </select>
        </div>
        <div class="ari-form-group">
            <label>Status</label>
            <select id="cal-modal-status">
                <option value="confirmed">Confirmed</option>
                <option value="tentative">Tentative</option>
            </select>
        </div>
        <div class="ari-form-group">
            <label>Colour</label>
            <input type="color" id="cal-modal-color" value="#4a90d9">
        </div>
        <div class="ari-ud-modal-actions">
            <button class="ari-btn ari-btn--primary" id="cal-modal-save">Save</button>
            <button class="ari-btn ari-btn--danger" id="cal-modal-delete" style="display:none;">Delete</button>
            <button class="ari-btn ari-btn--secondary" id="cal-modal-cancel">Cancel</button>
        </div>
    </div>
</div>

<div id="cal-toast" class="ari-toast" style="display:none;"></div>

<script>
window.ARI_CALENDAR = {
    listUrl: {{ url_for('api_user_calendar_list')|tojson }},
    saveUrl: {{ url_for('api_user_calendar_save')|tojson }},
    deleteUrl: {{ url_for('api_user_calendar_delete')|tojson }},
};
</script>
<script src="{{ url_for('static', filename='js/user_calendar.js') }}"></script>
{% endblock %}
