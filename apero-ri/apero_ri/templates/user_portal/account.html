{% extends "general/sidebar_base.html" %}
{% block title %}APERO RI – Account{% endblock %}

{% block doc_content %}
<div class="ari-page-header">
    <h1><i class="fa-solid fa-id-card"></i> Account</h1>
</div>

<div class="ari-login-box">
    <h2><i class="fa-solid fa-user-gear"></i> Account Details</h2>

    <div class="ari-form-group">
        <label for="acc-username">Username</label>
        <input type="text" id="acc-username" disabled>
    </div>
    <div class="ari-form-group">
        <label for="acc-first-names">First name(s)</label>
        <input type="text" id="acc-first-names">
    </div>
    <div class="ari-form-group">
        <label for="acc-last-name">Last name</label>
        <input type="text" id="acc-last-name">
    </div>

    <div class="ari-form-group">
        <label>Emails</label>
        <div id="acc-emails"></div>
        <small style="color:var(--ari-text-muted);">Primary email is shown below and requires verification if changed.</small>
        <button type="button" id="acc-add-email" class="ari-btn ari-btn--secondary ari-btn--sm" style="margin-top:0.35rem;">
            <i class="fa-solid fa-plus"></i> Add Email
        </button>
    </div>

    <div class="ari-form-group">
        <label for="acc-primary-email">Primary Email</label>
        <input type="email" id="acc-primary-email">
        <button type="button" id="acc-request-primary" class="ari-btn ari-btn--secondary ari-btn--sm" style="margin-top:0.35rem;">
            <i class="fa-solid fa-envelope-circle-check"></i> Send Verification Code
        </button>
    </div>

    <div id="acc-primary-verify" class="ari-form-group" style="display:none;">
        <label for="acc-primary-code">Enter 6-digit verification code</label>
        <input type="text" id="acc-primary-code" maxlength="6" inputmode="numeric" pattern="[0-9]*">
        <button type="button" id="acc-confirm-primary" class="ari-btn ari-btn--primary ari-btn--sm" style="margin-top:0.35rem;">
            <i class="fa-solid fa-check"></i> Confirm Primary Email
        </button>
    </div>

    <div class="ari-form-group">
        <label>Institutions</label>
        <div id="acc-inst"></div>
        <button type="button" id="acc-add-inst" class="ari-btn ari-btn--secondary ari-btn--sm" style="margin-top:0.35rem;">
            <i class="fa-solid fa-plus"></i> Add Institution
        </button>
    </div>

    <div class="ari-form-group">
        <label for="acc-primary-inst">Primary Institution</label>
        <select id="acc-primary-inst"></select>
    </div>

    <h3 style="margin-top:1rem;"><i class="fa-solid fa-key"></i> Change Password</h3>
    <div class="ari-form-group">
        <label for="acc-current-password">Current Password</label>
        <input type="password" id="acc-current-password" autocomplete="current-password">
    </div>
    <div class="ari-form-group">
        <label for="acc-new-password">New Password</label>
        <input type="password" id="acc-new-password" autocomplete="new-password">
    </div>
    <div class="ari-form-group">
        <label for="acc-confirm-password">Confirm New Password</label>
        <input type="password" id="acc-confirm-password" autocomplete="new-password">
    </div>

    <button id="acc-save" class="ari-btn ari-btn--primary ari-btn--block">
        <i class="fa-solid fa-floppy-disk"></i> Save Account Changes
    </button>
</div>

<div id="acc-toast" class="ari-toast" style="display:none;"></div>

<script>
window.ARI_ACCOUNT = {
    getUrl: {{ url_for('api_user_account_get')|tojson }},
    updateUrl: {{ url_for('api_user_account_update')|tojson }},
    requestPrimaryUrl: {{ url_for('api_user_account_request_primary_email')|tojson }},
    confirmPrimaryUrl: {{ url_for('api_user_account_confirm_primary_email')|tojson }}
};
</script>
<script src="{{ url_for('static', filename='js/user_account.js') }}"></script>
{% endblock %}
