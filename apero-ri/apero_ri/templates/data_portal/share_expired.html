<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APERO RI – Link Expired</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body { font-family: system-ui, sans-serif; background: #f5f6fa; margin: 0; padding: 2rem 1rem; }
        .sl-card { max-width: 480px; margin: 4rem auto; background: #fff;
                   border: 1px solid #d8dcee; border-radius: 10px;
                   box-shadow: 0 2px 12px rgba(63,81,181,.08);
                   padding: 2.5rem 2.5rem; text-align: center; }
        .sl-icon { font-size: 3rem; color: #c0392b; margin-bottom: 1rem; }
        h1 { font-size: 1.3rem; color: #333; margin: 0 0 0.75rem; }
        p { color: #666; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="sl-card">
        <div class="sl-icon"><i class="fa-solid fa-link-slash"></i></div>
        <h1>Link expired or not found</h1>
        <p>
            This shared download link has expired or is no longer valid.<br>
            APERO RI compiled downloads are automatically deleted after 24 hours.
        </p>
        <p>
            Please ask the person who shared this link to create a new download.
        </p>
    </div>
</body>
</html>
