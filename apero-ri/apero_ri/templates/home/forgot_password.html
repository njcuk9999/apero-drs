{% extends "general/base.html" %}
{% block title %}APERO RI – Forgot Password{% endblock %}

{% block content %}
<div class="ari-page-header">
    <h1><i class="{{ page_icon }}"></i> {{ page_label }}</h1>
</div>

<div class="ari-login-box">
    <h2><i class="fa-solid fa-envelope"></i> Reset Your Password</h2>
    <p>Enter your username or account email. If a matching account exists, we will email a reset link.</p>

    <form method="POST" action="{{ url_for('forgot_password') }}">
        <div class="ari-form-group">
            <label for="identifier">Username or Email</label>
            <input type="text" id="identifier" name="identifier" autocomplete="username email" required autofocus>
        </div>
        <button type="submit" class="ari-btn ari-btn--primary ari-btn--block">
            <i class="fa-solid fa-paper-plane"></i>
            Send Reset Link
        </button>
        <a href="{{ url_for('login') }}" class="ari-btn ari-btn--secondary ari-btn--block"
           style="margin-top:0.55rem; text-align:center; text-decoration:none;">
            <i class="fa-solid fa-right-to-bracket"></i>
            Back to Login
        </a>
    </form>
</div>
{% endblock %}
