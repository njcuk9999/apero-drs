{% extends "docs/doc_base.html" %}
{% block title %}APERO RI – Documentation{% endblock %}

{% block doc_content %}
<div class="ari-page-header">
    <h1><i class="{{ page_icon }}"></i> {{ page_label }}</h1>
</div>

{% if cards %}
<div class="ari-cards">
    {% for card in cards %}
    <a href="{{ card.url }}{% if current_version is defined %}?v={{ current_version }}{% endif %}"
       class="ari-card">
        <div class="ari-card__icon">
            <i class="{{ card.icon }}"></i>
        </div>
        <span class="ari-card__label">{{ card.label }}</span>
    </a>
    {% endfor %}
</div>
{% else %}
<p style="color: var(--ari-text-muted);">No sections available with your
current permissions.</p>
{% endif %}
{% endblock %}
