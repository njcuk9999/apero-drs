{% extends "general/base.html" %}

{% block title %}{{ code }} — {{ title }} | APERO RI{% endblock %}

{% block body_class %}ari-error-page{% endblock %}

{% block content %}
<div class="ari-error-container" style="max-width:600px;margin:10vh auto;text-align:center;padding:2rem;">
    <h1 style="font-size:6rem;margin:0;opacity:0.15;">{{ code }}</h1>
    <h2>{{ title }}</h2>
    <p style="color:var(--text-muted,#888);">{{ message }}</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary" style="margin-top:1.5rem;">
        &larr; Back to Home
    </a>
</div>
{% endblock %}
