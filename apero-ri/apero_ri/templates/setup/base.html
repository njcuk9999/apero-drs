<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}APERO RI Setup{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="ari-header">
        <div class="ari-header__logo">
            <span>APERO RI Setup</span>
        </div>
        <div class="ari-header__spacer"></div>
        <div class="ari-nav" aria-label="Setup navigation">
            <a href="{{ url_for('setup_email') }}" class="ari-nav__link" title="Email settings">
                <i class="fa-solid fa-envelope"></i>
            </a>
            <a href="{{ url_for('setup_admin') }}" class="ari-nav__link" title="Initial admin">
                <i class="fa-solid fa-user-shield"></i>
            </a>
            <a href="{{ url_for('setup_complete') }}" class="ari-nav__link" title="Completion">
                <i class="fa-solid fa-flag-checkered"></i>
            </a>
        </div>
    </header>

    <main class="ari-main">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="ari-flash ari-flash--{{ category }}">
            <i class="fa-solid fa-circle-info"></i>
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="ari-page-header">
            <h1><i class="fa-solid fa-gears"></i> {{ page_title }}</h1>
            <p>Local data directory: {{ local_data_dir }}</p>
        </div>

        {% block content %}{% endblock %}
    </main>
</body>
</html>
