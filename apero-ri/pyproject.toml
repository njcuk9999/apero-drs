[build-system]
requires = [
    "setuptools",
    "setuptools_scm[toml]>=3.4",
    "wheel"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ['version']
name = 'apero_ri'
authors = [
    {name = 'Neil Cook', email = 'neil.james.cook@gmail.com'},
]
description = 'APERO RI is the reduction interface (flask web app) for APERO.'
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = 'LICENSE'}
requires-python = ">=3.12"
dependencies = [
    "astropy==7.2.0",
    "ipython==8.32.0",
    "ipdb==0.13.13",
    "Bottleneck==1.6.0",
    "duckdb==1.4.4",
    "GitPython==3.1.46",
    "numba==0.64.0",
    "numexpr==2.14.1",
    "numpy==2.4.2",
    "pandas==3.0.1",
    "pandastable==0.14.0",
    "pandasql==0.7.3",
    "psutil==7.2.2",
    "PyYAML==6.0.3",
    "PyMySQL==1.1.2",
    "pytz==2025.2",
    "ruamel.yaml==0.19.1",
    "scipy==1.17.1",
    "SQLAlchemy==2.0.47",
    "sqlalchemy_utils==0.42.1",
    "statsmodels==0.14.6",
    "tqdm==4.67.3",
    "wget==3.2",
    "yagmail==0.15.293",
    # apero-drs requirements
    "astroquery==0.4.11",
    "astroplan==0.10.1",
    "barycorrpy==0.4.4",
    "beautifulsoup4==4.12.3",
    "bokeh==3.8.2",
    "gitchangelog==3.0.4",
    "gspread-pandas==3.3.0",
    "gspread==5.12.4",
    "matplotlib==3.10.8",
    "Pillow==12.1.1",
    "scikit-image==0.26.0",
    "Sphinx==9.1.0",
    "sphinx-toolbox==3.9.0",
    "ttkthemes==3.3.0",
    "xlrd==2.0.2",
    # apero-ri requirements
    "Flask>=3.1,<4",
    "cryptography>=44.0,<45",
]


[project.scripts]
apero_ri_run = "apero_ri.recipes.apero_ri_run:main"
apero_ri_setup = "apero_ri.recipes.apero_ri_setup:main"

[project.urls]
Homepage = 'http://apero.exoplanets.ca'
Repository = 'https://github.com/njcuk9999/apero-drs'

[project.optional-dependencies]
full = ["aperodrs @ git+https://github.com/njcuk9999/apero-drs.git@v0.8.running#subdirectory=apero-drs"]
dev = ["aperodrs"]

[tool.setuptools_scm]
root = ".."
write_to = "apero-ri/apero_ri/_version.py"
version_scheme = "release-branch-semver"
write_to_template = """
# file generated by setuptools-scm
# don't change, don't track in version control
__version__ = version = "{version}"
__version_tuple__ = version_tuple = {version_tuple}
__date__ = "{scm_version.node_date:%Y-%m-%d}"
"""
local_scheme = "node-and-date"