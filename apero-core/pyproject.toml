[build-system]
requires = [
    "setuptools",
    "setuptools_scm[toml]>=3.4",
    "wheel",
    "numpy==2.3.4"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ['version', 'scripts']
name = 'aperocore'
authors = [
    {name = 'Neil Cook', email = 'neil.james.cook@gmail.com'},
]
description = 'APERO core keeps all the core drs independent functions in one module for easy use internally and externally'
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = 'LICENSE'}
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy==7.2.0",
    "ipython==8.32.0",
    "ipdb==0.13.13",
    "Bottleneck==1.6.0",
    "duckdb==1.4.4",
    "GitPython==3.1.46",
    "llvmlite==0.45.1",
    "numba==0.62.1",
    "numexpr==2.14.1",
    "numpy==2.3.3",
    "pandas==3.0.0",
    "pandastable==0.14.0",
    "pandasql==0.7.3",
    "psutil==7.2.2",
    "PyYAML==6.0.3",
    "requests==2.33.1",
    "chardet<6",
    "PyMySQL==1.1.2",
    "pytz==2025.2",
    "ruamel.yaml==0.19.1",
    "scipy==1.17.0",
    "SQLAlchemy==2.0.47",
    "sqlalchemy_utils==0.42.1",
    "statsmodels==0.14.6",
    "tqdm==4.67.3",
    "wget==3.2",
    "yagmail==0.15.293",
]

[project.urls]
Homepage = 'http://apero.exoplanets.ca'
Repository = 'https://github.com/njcuk9999/apero-drs'

[tool.setuptools_scm]
root = ".."
write_to = "apero-core/aperocore/_version.py"
version_scheme = "release-branch-semver"
write_to_template = """
# file generated by setuptools-scm
# don't change, don't track in version control
__version__ = version = "{version}"
__version_tuple__ = version_tuple = {version_tuple}
__date__ = "{scm_version.node_date:%Y-%m-%d}"
"""
local_scheme = "node-and-date"