[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ['version', 'scripts']
name = 'aperocore'
authors = [
    {name = 'Neil Cook', email = 'neil.james.cook@gmail.com'},
]
description = 'APERO is a pipeline designed to reduce astrophysical observations (specifically from echelle spectrographs). It is the offical pipeline for SPIRou and is also used for NIRPS.'
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = 'LICENSE'}
requires-python = ">=3.9"
dependencies = [
    "astropy==5.3",
    "ipython==8.13.2",
    "ipdb==0.13.13",
    "Bottleneck==1.3.7",
    "duckdb==0.9",
    "GitPython==3.1.41",
    "numba==0.57.0",
    "numexpr==2.8.4",
    "numpy==1.24.3",
    "pandas==2.2.3",
    "pandastable==0.13.1",
    "pandasql==0.7.3",
    "psutil==5.9.4",
    "PyYAML==6.0",
    "PyMySQL==1.1.1",
    "ruamel.yaml==0.17.31",
    "scipy==1.10.1",
    "SQLAlchemy==2.0.15",
    "sqlalchemy_utils==0.41.1",
    "statsmodels==0.14.0",
    "tqdm==4.65.0",
    "wget==3.2",
    "yagmail==0.15.293",
]

[project.urls]
Homepage = 'http://apero.exoplanets.ca'
Repository = 'https://github.com/njcuk9999/apero-drs'

