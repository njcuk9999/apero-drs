# Define version
VERSION: 0.8.118
# Define date of release
DATE: 2025-12-03
# Define release type
RELEASE: beta
# Define authors
AUTHORS:
    - N. Cook
    - E. Artigau
# -----------------------------------------------------------------------------
# Language settings
# -----------------------------------------------------------------------------
# Default language
DEFAULT_LANG: ENG
# Supported languages
LANGUAGES:
    - ENG
    - FR
# Define the language modules for each instrument
LANGUAGE_MODULES:
    DEFAULT:
        - aperocore.drs_lang.tables.default_help
        - aperocore.drs_lang.tables.default_text
    SPIROU:
        - aperocore.drs_lang.tables.spirou_help
        - aperocore.drs_lang.tables.spirou_text
    NIRPS_HA:
        - aperocore.drs_lang.tables.nirps_ha_help
        - aperocore.drs_lang.tables.nirps_ha_text
    NIRPS_HE:
        - aperocore.drs_lang.tables.nirps_he_help
        - aperocore.drs_lang.tables.nirps_he_text
# -----------------------------------------------------------------------------
# Minimal log settings
# -----------------------------------------------------------------------------
LOG:
    # The recipe type that this parameter dictionary is associated with
    #   (i.e. recipe, tool, processing)
    RECIPE_TYPE: 'default'
    # The default length of the log messages displayed on the screen
    CHAR_LEN: 120
    # The log trigger key characters to use in log. Keys must be the same as
    # WRITE_LEVELS
    TRIG_KEYS:
        all: '  '
        error: '!!'
        warning: '@@'
        info: '**'
        graph: '~~'
        debug: '++'
    # The write levels. Keys must be the same as LOG_TRIG_KEYS
    # The write levels define which levels are logged and printed (based on
    # constants "PRINT_LEVEL" and "LOG_LEVEL" in the primary config file
    WRITE_LEVELS:
        error: 3
        warning: 2
        info: 1
        graph: 0
        all: 0
        debug: 0
    # The report levels. Keys must be the same as LOG_TRIG_KEYS()
    # If True then the input code is printed (used for errors /warning/debug)
    # if False just the message is printed
    REPORT_KEYS:
        error: True
        warning: True
        info: False
        graph: False
        all: False
        debug: False
    # the divider for low and high levels of sublevel
    SUBLEVEL_DIV: 5
    # the character to user for the divider (replaces second char in
    # LOG_TRIG_KEYS)
    SUBLEVEL_DIV_CHAR:
        LOW: '$'
        HIGH: '!'
# -----------------------------------------------------------------------------
# Other settings
# -----------------------------------------------------------------------------
# Use tqdm
USE_TQDM: true