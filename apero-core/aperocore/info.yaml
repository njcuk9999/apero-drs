# Define versionV
VERSION: 0.8.003
# Define date of release
DATE: 2024-10-16
# Define release type
RELEASE: beta
# Define authors
AUTHORS:
    - N. Cook
    - E. Artigau
# -----------------------------------------------------------------------------
# Language settings
# -----------------------------------------------------------------------------
# Default language
DEFAULT_LANG: ENG
# Supported languages
LANGUAGES:
    - ENG
    - FR
# -----------------------------------------------------------------------------
# Minimal log settings
# -----------------------------------------------------------------------------
LOG:
    DRS_RECIPE_TYPE: 'default'
    DRS_LOG_CHAR_LEN: 80
    LOG_TRIG_KEYS:
        all: '  '
        error: '!!'
        warning: '@@'
        info: '**'
        graph: '~~'
        debug: '++'
    WRITE_LEVELS:
        error: 3
        warning: 2
        info: 1
        graph: 0
        all: 0
        debug: 0
    REPORT_KEYS:
        error: True
        warning: True
        info: False
        graph: False
        all: False
        debug: False
    DRS_LOG_SUBLEVEL_DIV: 5
    DRS_LOG_SUBLEVEL_DIV_CHAR:
        LOW: '$'
        HIGH: '!'
