# Define version
DRS.VERSION: 0.8.106
# Define date of release
DRS.DATE: 2025-05-23
# Define release type
DRS.RELEASE: beta
# Define authors
DRS.AUTHORS:
    - N. Cook
    - E. Artigau
    - F. Bouchy
    - M. Hobson
    - C. Moutou
    - I. Boisse
    - E. Martioli
# Define instruments
DRS.INSTRUMENTS:
    - SPIROU
    - NIRPS_HA
    - NIRPS_HE
    - None
# -----------------------------------------------------------------------------
# Basic choices on options
# -----------------------------------------------------------------------------
# databases backends
DB_MODES:
    - 'mysql+pymysql'

# plotting modes available
PLOT_MODES:
    - 0
    - 1
    - 2
    - 3
PLOT_DESCS:
    - 'No plots'
    - 'Show plots'
    - 'Save plots'
    - 'Show and save plots'
# -----------------------------------------------------------------------------
# Hard coded constants that should not be changed ever
# -----------------------------------------------------------------------------
# Sun's elevation at civil twilight (degrees)
CIVIL_TWILIGHT: -6
# Sun's elevation at nautical twilight (degrees)
NAUTICAL_TWILIGHT: -12
# Sun's elevation at astronomical twilight (degrees)
ASTRONOMIAL_TWILIGHT: -18