# ------------------------------------------------------------------------------
# Global settings
# ------------------------------------------------------------------------------
# set the inpath where you have copied files
inpath: /scratch2/spirou/drs-data/static/
# set the mode (detector, telluric, wavelength, All)
#    This can be overridden at run time with --mode
mode: All

# -----------------------------------------------------------------------------
# Files
# -----------------------------------------------------------------------------
# All files should be placed in the inpath directory
# -----------------------------------------------------------------------------
files:
  # DARKs of different e.g. 60s, 600s (saved in the inpath directory)
  # These exposure times should be representative of short and long
  # science exposures, there should be multiple of each specific DARK exptime
  # exceptionally we can use just one set of exposure times (but they should
  # be long darks ~>600s
  # REQUIRED FOR: static detector, static wavelength
  raw_dark_files:
    - 2488223d.fits
    - 2488382d.fits
    - 2503164d.fits
    - 2503324d.fits
    - 2518936d.fits
    - 2519126d.fits

  # LED in all fibers, good SNR, not saturated (saved in the inpath directory)
  #  files should be dominated by systematics i.e. SNR ~ 300 when combined
  # REQUIRED FOR: detector (or provide engineering flat)
  raw_led_files:
  
  # Engineering flat from the manufacturer - Only set if no LED files available
  #   (saved in the in_path directory)
  #  REQUIRED FOR: detector (if no LED files)
  engineering_flat: engineering_flat.fits

  # DARK_FLAT (i.e. DARK in science fiber(s) and FLAT in reference fiber)
  # REQUIRED FOR: static wavelength
  raw_dark_flat_files:
   - 2488227f_pp.fits
   - 2488389f_pp.fits

  # FLAT_DARK (i.e. FLAT in science fiber(s) and DARK in reference fiber)
  raw_flat_dark_files:
    - 2488232f_pp.fits
    - 2488394f_pp.fits

  # FLAT_FLAT (i.e. FLAT in science fiber(s) and FLAT in reference fiber)
  raw_flat_files:
    - 2488237f_pp.fits
    - 2488399f_pp.fits
  # Input Hollow Cathode file (e.g. UNe, ThAr etc) both fibers (HC_HC)
  #   note must be in the raw directory
  # REQUIRED FOR: static wavelength
  raw_hc_file: HC_HC_file.fits
  # Input Fabry Perot file both fibers (FP_FP)
  # REQUIRED FOR: static wavelength
  raw_fp_file: FP_FP_file.fits

# ------------------------------------------------------------------------------
# Engineering
# ------------------------------------------------------------------------------
detector:
  # number of bins in each direction for large scale flat fielding
  flat_bin_size: 32
  # Fractional threshold for flat field bad pixels (relative deviation from 1)
  frac_flat_bad: 0.2
  # Threshold (in e-/s) for dark current to consider a pixel "hot"
  dark_threshold: 1
  # Threshold for setting pixels to NaN in the LED image prior to
  #     high-passing. This is used to flag areas that are masked in SPIRou and
  #     SPIP data and future instruments that have a part of the detector that
  #     are not illuminated when arriving from the pupil. For  instruments
  #     that do not have a focal-plane mask (e.g., NIRPS), you set to zero
  #     to simply only accept pixels that are light-sensitive. The default
  #     is 0 and adjusted for instruments with masks. This is expressed in
  #     fraction of the median flux. Reasonable values would be between
  #     0.4-0.6 depending on the amount of scattered lights
  led_threshold: 0.5

# ------------------------------------------------------------------------------
# Wavelength
# ------------------------------------------------------------------------------
# For cavity_length_ll_fit and ref_wave
wavelength:
  # Switches to turn on/off certain steps (these must be run in order at
  #    least once if not running all at once)
  run_generate_hc_catalogue: True
  run_generate_night: True
  run_generate_wave_guess: True

  # Fiber to use for wavelength solution (of all fibers)
  wave_fiber: AB

  # Input catalogue for the HC lines
  #   Must be in format
  input_hc_cat:
    # Input hollow cathode catalogue (saved in the inpath directory)
    #   Our defaut comes from Redman et al 2011: https://iopscience.iop.org/article/10.1088/0067-0049/195/2/24
    #   via Vizier: https://vizier.cds.unistra.fr/viz-bin/VizieR-3?-source=J/ApJS/195/24/table2
    #   This should be a vizier reference OR a absolute path to a file
    vizier-ref: J/ApJS/195/24/table2
    # file name this catalogue should have on disk
    filename: redman_2011.fits
    # format to load in astropy.table.Table.read
    format: fits
    # Wavelength column
    wave_col: lambda
    # Wavelength units
    wave_units: nm
    # Some realitive measure of flux
    flux_col: RFlux
    # Some identification of species (if file has only one unique species set
    #    to None)
    species_col: Ion
    # Species values to accept into our line list (i.e. those present in the HC)
    species_keep:
      - UI
      - UII
    # Rough wavelength domain for the instrument (i.e. wavelength of first 
    # extracted pixel in bluest order and last pixel in reddest order) in nm
    wave_domain:
      - 955
      - 2450
    # window size for HC lines (in km/s) - keep only brightest line within this
    # window
    window_size: 50

  # How many iterations to run to guess the wavelength solution
  #   Minimum is 2, recommended is at least 3
  number_iterations: 3

   # Initial guess for cavity length (in nm)
  cavity0: 23990000.0
  # First to last orders (nm)
  wave_domain:
    - 965
    - 2400
  # Fractional range for approximate wavelength
  wave_approx: 0.05
  # Number of lines to use per order
  n_lines: 200
  # Degree for robust_polyfit of FP peak step
  fp_peak_step_poly_deg: 1
  # Degree for robust_polyfit of FP peak count
  fp_peak_poly_deg: 3
  # Percentile for FP peak amplitude threshold
  fp_peak_keep_percentile: 90
  # Factor for FP peak amplitude threshold
  fp_peak_keep_factor: 0.3
  # Step for polyfit in wave_guess/fp_pix
  fp_peak_step_window: 5
  # Degree for polyfit in wave_guess/fp_pix
  fp_poly_deg: 5
  # Number of sigma to blindy accept an order as valid
  nsig_accept_fp: 15
  # Range for integer offset search
  fp_step_offs_range: 20
  # Step for integer offset search
  fp_step_offs_step: 1
  # Number of bins for histogram in mini
  fp_step_mad_bins: 40
  # Range for histogram in mini
  fp_step_mad_range:
    - -10
    - 10
  # Threshold for mini selection
  fp_step_mad_thresold: 2.0
  # Minimum number of valid points for fit
  fp_step_valid_min: 5
  # define the cavity refinement polyfit degree
  cavity_refine_poly_deg: 3
  # define the cavity refinement sigma for robust_polyfit
  cavity_refine_sigma: 8
  # Degree for robust_polyfit on Chebyshev coeffs
  robust_polyfit_deg: 7
  # Sigma cut for robust_polyfit on Chebyshev coeffs
  robust_polyfit_sigma: 3


